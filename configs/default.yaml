asr:
  model: openai/whisper-large-v3
  device: cuda
  compute_type: float16
  chunk_seconds: 2.0
  vad_enabled: true
  policy: align_att
  align_att:
    start_seconds: 2.0
    num_frames: 20
    threshold_layers: all

translator:
  model: facebook/nllb-200-distilled-600M
  ct2_model_dir: models/nllb-600m-ct2-int8
  device: cpu
  dtype: int8
  max_new_tokens: 256

context:
  rag:
    enabled: false
    hybrid: false
    dense_model: BAAI/bge-m3
    top_k: 5
    min_similarity: 0.65
  glossary:
    enabled: false
    injection_mode: prompt
    max_entries_in_prompt: 30
  translation_memory:
    enabled: false
    top_k: 3
    min_similarity: 0.75
  rolling_context:
    prev_segments: 0

personalization:
  lora:
    enabled: false
    adapter_dir: data/lora_adapters
    rank: 8
    alpha: 16
  speaker_id:
    enabled: false

tts:
  enabled: false
  model: FunAudioLLM/CosyVoice2-0.5B
  voice_cloning: true
  streaming: true

pipeline:
  latency_regime: low          # low | high
  target_streamlaal_s: 2.0
  log_metrics: true

api:
  host: 0.0.0.0
  port: 8000
